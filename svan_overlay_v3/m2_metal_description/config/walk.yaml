# Parameters for svan_walk_controller (loaded by gazebo.launch.py)
svan_walk_controller:
  ros__parameters:
    waypoints: [1.0, 0.0,   1.0, 1.0,   0.0, 1.0,   0.0, 0.0]   # x0,y0, x1,y1, ... [m] in the world frame (robot spawns at 0,0 facing +x)
    walk_start_time: 6.0     # s (sim time) standing still before the path starts
    v_max: 0.25              # m/s  forward speed along the path
    w_max: 0.8               # rad/s turning rate limit
    k_head: 1.5              # heading P-gain
    reach: 0.08              # m, waypoint-reached radius
    gait_period: 0.5         # s per trot cycle
    step_height: 0.05        # m foot clearance
    kp: [60.0, 80.0, 90.0]   # Nm/rad  (hip, thigh, calf)
    kd: [0.3, 0.36, 0.45]    # Nm.s/rad  -- keep small: ROS latency makes a big kd chatter
    ki: 0.0
    ramp_time: 3.0           # s to blend from the measured pose to the stand pose
    ff_scale: 1.0            # 1.0 = full gravity feed-forward for the stand pose
    flip_limit_deg: 57.0     # body tilt above this for flip_hold s counts as "robot flipped"
    flip_hold: 1.0           # s
    auto_reset: true         # flipped -> torques off + call Gazebo /reset_world, then stand up and restart the path
    max_resets: 3
